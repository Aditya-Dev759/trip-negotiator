<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="800" fill="#ffffff"/>
  <text x="600" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">TripNegotiator -- Component Architecture</text>

  <!-- User -->
  <rect x="30" y="360" width="120" height="60" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="90" y="385" text-anchor="middle" font-size="13" font-weight="600" fill="#312e81">Traveler</text>
  <text x="90" y="402" text-anchor="middle" font-size="11" fill="#4338ca">(Browser)</text>

  <!-- CloudFront + S3 frontend -->
  <rect x="200" y="80" width="170" height="70" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="285" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">CloudFront CDN</text>
  <text x="285" y="122" text-anchor="middle" font-size="11" fill="#1e40af">+ S3 (static Next.js</text>
  <text x="285" y="136" text-anchor="middle" font-size="11" fill="#1e40af">export build)</text>

  <!-- API Gateway -->
  <rect x="200" y="360" width="170" height="60" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="285" y="385" text-anchor="middle" font-size="13" font-weight="600" fill="#78350f">API Gateway</text>
  <text x="285" y="402" text-anchor="middle" font-size="11" fill="#92400e">HTTP API (proxy)</text>

  <!-- Cognito (optional) -->
  <rect x="200" y="440" width="170" height="60" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="285" y="463" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">Cognito JWT auth</text>
  <text x="285" y="479" text-anchor="middle" font-size="10" fill="#6b7280">optional: enable_auth=true</text>
  <text x="285" y="493" text-anchor="middle" font-size="10" fill="#6b7280">(off by default)</text>

  <!-- api Lambda -->
  <rect x="430" y="360" width="180" height="70" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="520" y="382" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">Lambda: api</text>
  <text x="520" y="398" text-anchor="middle" font-size="10" fill="#166534">FastAPI + Mangum</text>
  <text x="520" y="412" text-anchor="middle" font-size="10" fill="#166534">(container image, arm64)</text>

  <!-- Step Functions -->
  <rect x="680" y="200" width="230" height="90" rx="10" fill="#fae8ff" stroke="#a21caf" stroke-width="1.5"/>
  <text x="795" y="225" text-anchor="middle" font-size="13" font-weight="600" fill="#701a75">Step Functions</text>
  <text x="795" y="242" text-anchor="middle" font-size="10" fill="#86198f">Negotiation workflow</text>
  <text x="795" y="257" text-anchor="middle" font-size="10" fill="#86198f">(retry/catch, bounded</text>
  <text x="795" y="271" text-anchor="middle" font-size="10" fill="#86198f">to 3 rounds, X-Ray on)</text>

  <!-- Agent lambdas -->
  <rect x="680" y="330" width="230" height="170" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="795" y="352" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">Agent Lambdas (container image)</text>
  <text x="795" y="374" text-anchor="middle" font-size="11" fill="#166534">Itinerary Agent</text>
  <text x="795" y="393" text-anchor="middle" font-size="11" fill="#166534">Budget Agent</text>
  <text x="795" y="412" text-anchor="middle" font-size="11" fill="#166534">Logistics Agent</text>
  <text x="795" y="431" text-anchor="middle" font-size="11" fill="#166534">Booking Agent</text>
  <text x="795" y="450" text-anchor="middle" font-size="11" fill="#166534">Supervisor (plain zip)</text>
  <text x="795" y="472" text-anchor="middle" font-size="10" fill="#4d7c0f">arm64 / Graviton2</text>
  <text x="795" y="486" text-anchor="middle" font-size="10" fill="#4d7c0f">X-Ray active tracing</text>

  <!-- DynamoDB -->
  <rect x="430" y="480" width="180" height="60" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="520" y="503" text-anchor="middle" font-size="13" font-weight="600" fill="#312e81">DynamoDB</text>
  <text x="520" y="519" text-anchor="middle" font-size="10" fill="#4338ca">negotiation state, PITR on</text>

  <!-- S3 data -->
  <rect x="430" y="560" width="180" height="60" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="520" y="583" text-anchor="middle" font-size="13" font-weight="600" fill="#312e81">S3 (reference data)</text>
  <text x="520" y="599" text-anchor="middle" font-size="10" fill="#4338ca">destinations/costs/visas/FX</text>

  <!-- SSM -->
  <rect x="430" y="640" width="180" height="55" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="520" y="663" text-anchor="middle" font-size="12" font-weight="600" fill="#312e81">SSM Parameter Store</text>
  <text x="520" y="679" text-anchor="middle" font-size="10" fill="#4338ca">Groq API key (SecureString)</text>

  <!-- External services -->
  <rect x="960" y="330" width="210" height="170" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="1065" y="352" text-anchor="middle" font-size="12" font-weight="600" fill="#7f1d1d">External services</text>
  <text x="1065" y="376" text-anchor="middle" font-size="11" fill="#991b1b">Groq LLM API</text>
  <text x="1065" y="395" text-anchor="middle" font-size="11" fill="#991b1b">ddgs (web search)</text>
  <text x="1065" y="414" text-anchor="middle" font-size="11" fill="#991b1b">Open-Meteo geocoding</text>
  <text x="1065" y="433" text-anchor="middle" font-size="11" fill="#991b1b">Frankfurter FX rates</text>
  <text x="1065" y="456" text-anchor="middle" font-size="10" fill="#b91c1c">all free / keyless,</text>
  <text x="1065" y="470" text-anchor="middle" font-size="10" fill="#b91c1c">outside AWS spend</text>

  <!-- Monitoring -->
  <rect x="680" y="560" width="230" height="90" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="795" y="582" text-anchor="middle" font-size="12" font-weight="600" fill="#7c2d12">Monitoring</text>
  <text x="795" y="602" text-anchor="middle" font-size="10" fill="#9a3412">CloudWatch alarms (errors,</text>
  <text x="795" y="616" text-anchor="middle" font-size="10" fill="#9a3412">duration, SFN failures)</text>
  <text x="795" y="634" text-anchor="middle" font-size="10" fill="#9a3412">-&gt; SNS -&gt; email</text>

  <!-- Budgets -->
  <rect x="430" y="720" width="180" height="55" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="520" y="743" text-anchor="middle" font-size="12" font-weight="600" fill="#7c2d12">AWS Budgets</text>
  <text x="520" y="759" text-anchor="middle" font-size="10" fill="#9a3412">$5/mo guardrail (80%/100%)</text>

  <!-- Arrows -->
  <line x1="150" y1="380" x2="196" y2="380" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="90" y1="360" x2="90" y2="140" stroke="#475569" stroke-width="1.5"/>
  <line x1="90" y1="140" x2="196" y2="130" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="120" y="250" font-size="10" fill="#475569">static assets</text>

  <line x1="370" y1="390" x2="426" y2="390" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="378" y="384" font-size="9" fill="#475569">HTTPS</text>

  <line x1="520" y1="360" x2="520" y2="290" stroke="#475569" stroke-width="1.5"/>
  <line x1="520" y1="290" x2="676" y2="255" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="540" y="300" font-size="9" fill="#475569">POST /trips -&gt; StartExecution</text>

  <line x1="795" y1="290" x2="795" y2="326" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="805" y="312" font-size="9" fill="#475569">orchestrates</text>

  <line x1="610" y1="410" x2="676" y2="410" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="3,3"/>
  <text x="612" y="404" font-size="9" fill="#475569">GET reads state</text>

  <line x1="520" y1="430" x2="520" y2="476" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="795" y1="500" x2="640" y2="510" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="795" y1="500" x2="640" y2="585" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="430" x2="795" y2="470" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,3"/>

  <line x1="795" y1="500" x2="520" y2="655" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="650" y="650" font-size="9" fill="#475569">reads Groq key</text>

  <line x1="910" y1="410" x2="956" y2="410" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="915" y="404" font-size="9" fill="#475569">live grounding</text>

  <line x1="795" y1="500" x2="795" y2="556" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="520" y1="620" x2="520" y2="716" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,3"/>

  <line x1="370" y1="470" x2="366" y2="470" stroke="none"/>
  <line x1="370" y1="470" x2="196" y2="470" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="30" y="720" width="16" height="16" fill="#dcfce7" stroke="#15803d"/>
  <text x="52" y="733" font-size="10" fill="#334155">Compute (Lambda)</text>
  <rect x="30" y="742" width="16" height="16" fill="#e0e7ff" stroke="#4338ca"/>
  <text x="52" y="755" font-size="10" fill="#334155">Storage / config</text>
  <rect x="180" y="720" width="16" height="16" fill="#ffedd5" stroke="#c2410c"/>
  <text x="202" y="733" font-size="10" fill="#334155">Observability / cost</text>
  <rect x="180" y="742" width="16" height="16" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="202" y="755" font-size="10" fill="#334155">External (non-AWS)</text>
</svg>
