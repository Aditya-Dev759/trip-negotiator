name: deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt flake8
          # Previously this only installed flake8+pytest, so `pytest tests/`
          # below would fail as soon as any test imported fastapi/ddgs/boto3
          # (i.e. anything touching api/main.py or agents/*) with a bare
          # ModuleNotFoundError -- installing the real requirements.txt is
          # what actually makes this job exercise the app.

      - name: Lint with flake8
        run: |
          flake8 agents/ shared/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 agents/ shared/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests
        run: |
          pytest tests/ -v

  plan:
    needs: lint-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Plan
        working-directory: infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          TF_VAR_groq_api_key: ${{ secrets.GROQ_API_KEY }}
          TF_VAR_cognito_user_email: ${{ secrets.COGNITO_USER_EMAIL }}
        run: |
          terraform init
          terraform plan

  apply:
    needs: lint-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Ensure ECR repository exists
        working-directory: infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          # Terraform validates every declared variable (variables.tf) up
          # front before resolving -target, even ones the targeted resource
          # never references -- without these two, this step hangs/fails on
          # an interactive "Enter a value:" prompt for var.cognito_user_email
          # in CI (no TTY, so it just errors out), before ever reaching the
          # later, correctly-configured "Terraform Apply" step. Confirmed for
          # real via a live Actions run.
          TF_VAR_groq_api_key: ${{ secrets.GROQ_API_KEY }}
          TF_VAR_cognito_user_email: ${{ secrets.COGNITO_USER_EMAIL }}
        run: |
          terraform init
          terraform apply -auto-approve -target=aws_ecr_repository.lambda_image

      # Container-image Lambdas (api, itinerary_agent, budget_agent,
      # logistics_agent, booking_agent -- see infra/lambda.tf) need an image
      # already pushed to ECR before Terraform can create/update them, since
      # they reference the image URI directly. This step is the CD
      # pipeline's missing half from before: previously this workflow ran
      # `terraform apply` against Lambda definitions that could never have
      # deployed successfully, because nothing ever built or pushed an image
      # for them, and the zip-based Lambdas it *did* define never actually
      # bundled their third-party dependencies (ddgs/fastapi/mangum) either.
      - name: Set up QEMU (arm64 emulation for cross-arch build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Lambda image
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: us-east-1
        run: bash build-lambda-image.sh "${{ github.sha }}"

      - name: Terraform Apply
        working-directory: infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          TF_VAR_lambda_image_tag: ${{ github.sha }}
          TF_VAR_groq_api_key: ${{ secrets.GROQ_API_KEY }}
          TF_VAR_cognito_user_email: ${{ secrets.COGNITO_USER_EMAIL }}
        run: |
          terraform init
          terraform apply -auto-approve

      # Frontend build+deploy, driven by this job's own Terraform outputs.
      # This closes the gap deploy-frontend.bat/.sh hits when run from a
      # developer's machine: since infra/ uses backend "local" and this job's
      # state file only ever exists on this ephemeral runner, no local
      # machine's `terraform output` can ever see what CI itself just
      # created. Reading the outputs here, in the same job/filesystem right
      # after the apply that produced them, is the one place they're
      # actually available.
      - name: Read Terraform outputs for frontend build
        working-directory: infra
        run: |
          echo "API_URL=$(terraform output -raw api_endpoint)" >> $GITHUB_ENV
          echo "BUCKET=$(terraform output -raw frontend_bucket)" >> $GITHUB_ENV
          echo "USER_POOL_ID=$(terraform output -raw cognito_user_pool_id)" >> $GITHUB_ENV
          echo "SPA_CLIENT_ID=$(terraform output -raw cognito_spa_client_id)" >> $GITHUB_ENV

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: frontend
        run: |
          cat > .env.local << EOF
          NEXT_PUBLIC_API_URL=${{ env.API_URL }}
          NEXT_PUBLIC_COGNITO_USER_POOL_ID=${{ env.USER_POOL_ID }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID=${{ env.SPA_CLIENT_ID }}
          EOF
          npm install
          npm run build

      - name: Deploy frontend to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          aws s3 sync frontend/out/ "s3://${{ env.BUCKET }}/" --delete --cache-control "public, max-age=3600"
          echo "Frontend deployed: http://$(cd infra && terraform output -raw frontend_website_endpoint)"
